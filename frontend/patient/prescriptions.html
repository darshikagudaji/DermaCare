
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prescriptions | Dermacare</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >
    <link rel="stylesheet" href="css/prescriptions.css">
</head>

<body>
<div class="container">

    <button
        class="menu-toggle"
        id="menuToggle"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
    >
        <i class="bi bi-list"></i>
    </button>

    <div class="overlay" id="overlay"></div>

    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <span>Dermacare</span>
        </div>

        <div class="menu-title">MAIN</div>

        <nav>
            <ul>
                <li>
                    <a href="dashboard.html">
                        <i class="bi bi-grid-1x2-fill"></i>
                        <span>Dashboard</span>
                    </a>
                </li>

                <li>
                    <a href="appointment-history.html">
                        <i class="bi bi-calendar-check-fill"></i>
                        <span>Appointment History</span>
                    </a>
                </li>

                <li class="active">
                    <a href="prescriptions.html">
                        <i class="bi bi-file-earmark-medical-fill"></i>
                        <span>Prescriptions</span>
                    </a>
                </li>

                <li>
                    <a href="profile.html">
                        <i class="bi bi-person-circle"></i>
                        <span>My Profile</span>
                    </a>
                </li>
            </ul>
        </nav>

        <div class="logout">
            <a href="#" id="logoutLink">
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
            </a>
        </div>
    </aside>

    <main class="content">
        <section class="page-header">
            <h1>My Prescriptions</h1>
            <p>
                View medicines and follow-up details provided by your dermatologist.
            </p>
        </section>

        <!-- Patient details and prescriptions are loaded from the backend. -->
        <div id="prescriptionList" aria-live="polite">
            <div class="prescription-card">
                <p>
                    <i class="bi bi-arrow-repeat"></i>
                    Loading your prescriptions...
                </p>
            </div>
        </div>

        <p id="prescriptionMessage" role="status" aria-live="polite"></p>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="js/prescriptions.js"></script>
</body>
</html>
