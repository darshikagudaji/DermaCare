
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | DermCare</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/forgot-password.css">
</head>
<body>

    <div class="forgot-container">

        <h1>Forgot Password?</h1>
        <div class="heading-line"></div>

        <p class="subtitle">
            Reset your DermCare Clinic account password.
        </p>

        <form id="forgotPasswordForm">

            <!-- Registered Email -->
            <div class="form-group">
                <label for="email">Email</label>

                <div class="input-box">
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your registered email"
                        autocomplete="email"
                        required
                    >
                </div>

                <span id="emailError" class="field-error"></span>
            </div>

            <!-- New Password -->
            <div class="form-group">
                <label for="newPassword">New Password</label>

                <div class="input-box password-box">
                    <input
                        type="password"
                        id="newPassword"
                        name="newPassword"
                        placeholder="Enter new password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="newPassword"
                        aria-label="Show new password"
                    >
                        <i class="bi bi-eye"></i>
                    </button>
                </div>

                <span id="newPasswordError" class="field-error"></span>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>

                <div class="input-box password-box">
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm new password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="confirmPassword"
                        aria-label="Show confirm password"
                    >
                        <i class="bi bi-eye"></i>
                    </button>
                </div>

                <span id="confirmPasswordError" class="field-error"></span>
            </div>

            <button type="submit" id="submitButton">
                Reset Password
            </button>

            <p
                id="message"
                class="message"
                role="status"
                aria-live="polite"
            ></p>

        </form>

        <p class="login-text">
            Remember your password?
            <a href="../login.html">Login</a>
        </p>

    </div>

    <script src="js/forgot-password.js"></script>

</body>
</html>
