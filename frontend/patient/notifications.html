<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Notifications | Dermacare</title>


    <!-- BOOTSTRAP ICONS -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >


    <!-- EXISTING DASHBOARD CSS -->

    <link
        rel="stylesheet"
        href="css/dashboard.css"
    >


    <!-- NOTIFICATIONS PAGE CSS -->

    <link
        rel="stylesheet"
        href="css/notifications.css"
    >

</head>


<body>


    <!-- MOBILE MENU BUTTON -->

    <button
        class="menu-toggle"
        id="menuToggle"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
    >

        <i class="bi bi-list"></i>

    </button>



    <!-- MAIN CONTAINER -->

    <div class="container">


        <!-- SIDEBAR -->

        <aside class="sidebar">


            <div class="logo">
                <span>Dermacare</span>
            </div>


            <div class="menu-title">
                MAIN
            </div>


            <nav>

                <ul>

                    <li>

                        <a href="dashboard.html">

                            <i class="bi bi-grid-1x2-fill"></i>

                            <span>Dashboard</span>

                        </a>

                    </li>


                    <li>

                        <a href="appointment-history.html">

                            <i class="bi bi-calendar-check-fill"></i>

                            <span>Appointment History</span>

                        </a>

                    </li>


                    <li>

                        <a href="prescriptions.html">

                            <i class="bi bi-file-earmark-medical-fill"></i>

                            <span>Prescriptions</span>

                        </a>

                    </li>


                    <li>

                        <a href="profile.html">

                            <i class="bi bi-person-circle"></i>

                            <span>My Profile</span>

                        </a>

                    </li>

                </ul>

            </nav>


            <div class="logout">

                <a href="#" id="logoutLink">

                    <i class="bi bi-box-arrow-right"></i>

                    <span>Logout</span>

                </a>

            </div>


        </aside>



        <!-- OVERLAY -->

        <div
            class="overlay"
            id="overlay"
        ></div>



        <!-- MAIN CONTENT -->

        <main class="content notification-page">


            <!-- PAGE HEADER -->

            <div class="notification-page-header">

                <div>

                    <a
                        href="dashboard.html"
                        class="back-to-dashboard"
                    >

                        <i class="bi bi-arrow-left"></i>

                        Back to Dashboard

                    </a>


                    <h1>

                        <i class="bi bi-bell-fill"></i>

                        Notifications

                    </h1>


                    <p>
                        Stay updated about your appointments and clinic activities.
                    </p>

                </div>


                <button
                    type="button"
                    id="markAllRead"
                    class="mark-all-read-btn"
                >

                    <i class="bi bi-check2-all"></i>

                    Mark all as read

                </button>

            </div>



            <!-- NOTIFICATION SUMMARY -->

            <div class="notification-summary">

                <span id="notificationSummary">
                    Loading notifications...
                </span>

            </div>



            <!-- NOTIFICATION LIST -->

            <div
                class="notification-list"
                id="notificationList"
            >

                <div class="notification-loading">

                    <i class="bi bi-hourglass-split"></i>

                    Loading notifications...

                </div>

            </div>


        </main>


    </div>



    <!-- NOTIFICATIONS JAVASCRIPT -->

    <script src="js/notifications.js"></script>


</body>

</html>
