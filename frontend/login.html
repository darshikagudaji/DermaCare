<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"

        href="patient/css/login.css"

        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

</head>


<body>


    <!-- =======================================================

    ======================================================== -->

        class="notification"

    >

        <span id="notificationMessage"></span>

    </div>



    <!-- =======================================================
         HEADER
    ======================================================== -->

    <header class="header">

        <div class="container">


            <!-- =================================================
                 TEXT LOGO
            ================================================== -->

            <a
                href="index.html"
                class="logo"
            >

                Dermacare

            </a>



            <!-- =================================================
                 DESKTOP NAVIGATION
            ================================================== -->

            <nav>

                <ul>

                    <li>

                        <a
                            class="active"
                            href="index.html"
                        >

                            <i class="bi bi-house-door"></i>

                            Home

                        </a>

                    </li>


                    <li>

                        <a href="about.html">

                            <i class="bi bi-info-circle"></i>

                            About Us

                        </a>

                    </li>


                    <li>

                        <a href="services.html">

                            <i class="bi bi-heart-pulse"></i>

                            Services

                        </a>

                    </li>


                    <li>

                        <a href="doctor/doctors.html">

                            <i class="bi bi-person-badge"></i>

                            Doctors

                        </a>

                    </li>


                    <li>

                        <a href="contact.html">

                            <i class="bi bi-telephone"></i>

                            Contact

                        </a>

                    </li>

                </ul>

            </nav>



            <!-- =================================================
                 LOGIN / REGISTER BUTTONS
            ================================================== -->

            <div class="header-buttons">

                <a
                    href="login.html"
                    class="login-btn active-btn"
                >

                    <i class="bi bi-box-arrow-in-right"></i>

                    Login

                </a>


                <a
                    href="register.html"
                    class="register-btn"
                >

                    <i class="bi bi-person-plus"></i>

                    Register

                </a>

            </div>


        </div>

    </header>



    <!-- =======================================================
         MOBILE HAMBURGER BUTTON
         
         KEPT OUTSIDE SIDEBAR SO IT IS VISIBLE
         WHEN SIDEBAR IS CLOSED.
    ======================================================== -->

    <button
        class="menu-toggle"
        id="menuToggle"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
    >

        <i class="bi bi-list"></i>

    </button>



    <!-- =======================================================
         MOBILE SIDEBAR OVERLAY
    ======================================================== -->

    <div
        class="overlay"
        id="overlay"
    ></div>



    <!-- =======================================================
         MOBILE SIDEBAR
    ======================================================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >


        <!-- ===================================================
             SIDEBAR LOGO
        ==================================================== -->

        <div class="sidebar-logo">

            <a href="index.html">

                Dermacare

            </a>

        </div>



        <!-- ===================================================
             SIDEBAR NAVIGATION
        ==================================================== -->

        <nav>

            <ul>

                <li>

                    <a href="index.html">

                        <i class="bi bi-house-door"></i>

                        Home

                    </a>

                </li>


                <li>

                    <a href="about.html">

                        <i class="bi bi-info-circle"></i>

                        About Us

                    </a>

                </li>


                <li>

                    <a href="services.html">

                        <i class="bi bi-heart-pulse"></i>

                        Services

                    </a>

                </li>


                <li>

                    <a href="doctor/doctors.html">

                        <i class="bi bi-person-badge"></i>

                        Doctors

                    </a>

                </li>


                <li>

                    <a href="contact.html">

                        <i class="bi bi-telephone"></i>

                        Contact

                    </a>

                </li>

            </ul>

        </nav>

        
<!-- MOBILE LOGIN AND REGISTER BUTTONS -->
<div class="mobile-auth-buttons">

    <a href="login.html" class="mobile-login-btn">
        <i class="bi bi-box-arrow-in-right"></i>
        Login
    </a>

    <a href="register.html" class="mobile-register-btn">
        <i class="bi bi-person-plus"></i>
        Register
    </a>

</div>


    </aside>



    <!-- =======================================================
         LOGIN PAGE
    ======================================================== -->

    <main class="auth-page">

        <div class="auth-container">


            <!-- =================================================
                 HEADING
            ================================================== -->

            <h1>

                Login

            </h1>


            <p class="auth-subtitle">

                Login to your DermCare Clinic account.

            </p>



            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <form
                id="loginForm"
                novalidate
            >


                <!-- =================================================
                     EMAIL
                ================================================== -->

                <div class="form-group">

                    <label for="loginEmail">

                        Email

                    </label>


                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="Enter your email"
                    >


                    <span
                        id="loginEmailError"
                        class="field-error"
                    ></span>

                </div>



                <!-- =================================================
                     PASSWORD
                ================================================== -->

                <div class="form-group">

                    <label for="loginPassword">

                        Password

                    </label>


                    <div class="password-box">

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                        >


                        <!-- PASSWORD EYE -->

                        <button
                            type="button"
                            class="eye"
                            id="loginPasswordEye"
                            aria-label="Show password"
                        >

                            <i class="bi bi-eye"></i>

                        </button>

                    </div>


                    <span
                        id="loginPasswordError"
                        class="field-error"
                    ></span>

                    
<div class="forgot-password-wrapper">
    <a href="patient/forgot-password.html" class="forgot-password">
        Forgot Password?
    </a>
</div>


                </div>



                <!-- =================================================
                     LOGIN BUTTON
                ================================================== -->

                <button
                    type="submit"
                    class="auth-submit"
                >

                    Login

                </button>


            </form>



            <!-- =================================================
                 REGISTER LINK
            ================================================== -->

            <p class="account-link">

                Don't have an account?

                <a href="register.html">

                    Register

                </a>

            </p>


        </div>

    </main>



    <!-- =======================================================
         LOGIN JAVASCRIPT
    ======================================================== -->

    <script src="patient/js/login.js"></script>


</body>

</html>
